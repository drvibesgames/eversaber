<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nonce Hunter Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090d;--panel:rgba(10,13,19,.92);--line:rgba(255,255,255,.12);--amber:#ffb627;--cyan:#3fd0ff;--red:#ff4d5e;--green:#45e08a;--txt:#e9edf2;--dim:#8b95a3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:rgba(255,255,255,.06);border:1px solid var(--line);padding:10px 16px;border-radius:6px;transition:.15s}
.btn:hover,.btn:focus{background:rgba(255,182,39,.16);border-color:var(--amber);outline:none}
.btn.primary{background:var(--amber);color:#111;border-color:var(--amber);font-weight:800}
.btn.primary:hover{filter:brightness(1.1)}
h1,h2,h3,.bebas{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.06em;font-weight:400;margin:0}
.mono{font-family:'IBM Plex Mono',monospace}
/* screens */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:40;padding:16px}
#boot{background:#000;cursor:pointer}
.debrief{margin-top:12px;padding:10px 14px;border:1px solid rgba(63,208,255,.35);border-radius:8px;background:rgba(63,208,255,.06)}.debrief h3{margin:0 0 6px;color:var(--cyan)}.debrief ul{margin:0;padding-left:18px;font-size:13px;line-height:1.45}
#boot p{font-family:'IBM Plex Mono',monospace;color:var(--dim);opacity:0;animation:bootIn .4s 1s forwards,pulse 1.6s 1.4s infinite}
#boot h1{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(40px,9vw,92px);line-height:.92;letter-spacing:3px;text-align:center;color:#fff;margin:0 0 22px;animation:bootT .9s ease-out both}
#boot .bb{width:min(260px,60vw);height:3px;background:#222;border-radius:2px;overflow:hidden;margin-bottom:18px}
#boot .bb i{display:block;height:100%;width:0;background:var(--amber,#ffb627);animation:bootBar 1s ease-out forwards}
@keyframes bootBar{to{width:100%}}@keyframes bootIn{to{opacity:1}}@keyframes bootT{from{opacity:0;transform:scale(1.06);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes pulse{50%{opacity:.3}}
#splash{background:radial-gradient(circle at 50% 50%,#1b0b2e,#000 70%)}
#splash .logo{font-family:'Bebas Neue';font-size:clamp(40px,9vw,110px);letter-spacing:.12em;color:#fff;text-shadow:0 0 18px #c04bff,0 0 42px #ff3fa4;opacity:0;animation:spl 3s ease forwards}
#splash .sub{font-family:'IBM Plex Mono';color:#d8b4ff;letter-spacing:.4em;font-size:13px;opacity:0;animation:spl 3s .3s ease forwards}
@keyframes spl{0%{opacity:0;transform:scale(.94)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#title{background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.85)),radial-gradient(circle at 70% 20%,#3a1d08 0,#07090d 60%)}
#title h1{font-size:clamp(56px,12vw,150px);line-height:.9;color:var(--amber);text-shadow:0 6px 0 #4a2a00,0 0 40px rgba(255,182,39,.35);text-align:center}
#title .sim{font-family:'Bebas Neue';font-size:clamp(22px,4.4vw,46px);letter-spacing:.62em;margin-left:.62em;color:#fff;text-shadow:0 0 18px rgba(255,182,39,.35);margin-top:4px}
#title .tag{font-family:'IBM Plex Mono';color:var(--dim);letter-spacing:.3em;margin:6px 0 26px;font-size:12px;text-align:center}
#title .menu{display:flex;flex-direction:column;gap:10px;width:min(320px,90vw)}
@media(max-height:900px){#title h1{font-size:clamp(44px,min(12vw,15vh),150px)}#title .tag{margin:4px 0 14px}#title .menu{gap:7px}#title .menu .btn{padding-top:9px;padding-bottom:9px}#title .teamline{margin-top:12px}}
@media(max-height:780px){#title .teamline{display:none!important}#title .menu{gap:5px}#title .menu .btn{padding-top:7px;padding-bottom:7px}}
@media(max-height:700px){#title .menu .btn{padding-top:4px;padding-bottom:4px;font-size:14px}#title .tag{display:none}#title h1{font-size:clamp(34px,min(9vw,10vh),90px)}#title .sim{font-size:24px}}
#title .teamline{display:flex;align-items:center;gap:10px;margin-top:22px;color:var(--dim);font-size:13px}
.panelbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:min(980px,96vw);max-height:92vh;overflow:auto;width:100%}
/* phase announce */
#phase{position:fixed;top:8%;left:50%;transform:translateX(-50%);z-index:75;pointer-events:none;opacity:0;text-align:center;background:rgba(6,8,12,.8);border:1px solid rgba(255,182,39,.45);border-left:4px solid var(--amber);padding:14px 38px 12px;white-space:nowrap;box-shadow:0 10px 50px rgba(0,0,0,.6)}
#phase .n{font-family:'IBM Plex Mono';font-size:12px;letter-spacing:.6em;color:var(--amber)}
#phase .t{font-family:'Bebas Neue';font-size:clamp(30px,6vw,58px);letter-spacing:.35em;color:#fff;margin-left:.35em}
#phase.low{top:auto;bottom:16%}
#phase.show{animation:phase 3.6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes phase{0%{opacity:0;clip-path:inset(0 50% 0 50%);letter-spacing:0}12%{opacity:1;clip-path:inset(0 0 0 0)}82%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 0);transform:translateX(-50%) translateY(-10px)}}
#fade{position:fixed;inset:0;background:#000;z-index:55;pointer-events:none;opacity:0;transition:opacity .5s}
#fade.on{opacity:1}
/* hud */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud .tl{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.55);padding:6px 12px 6px 6px;border-radius:30px;border:1px solid var(--line)}
#hud .tl b{font-family:'Bebas Neue';letter-spacing:.1em;font-size:18px}
#hud .tl small{display:block;color:var(--dim);font-size:10px;letter-spacing:.2em}
#hud .tc{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;background:rgba(0,0,0,.6);padding:4px 16px;border-radius:6px;border:1px solid var(--line)}
#hud .tc .clk{font-family:'IBM Plex Mono';font-size:20px;font-weight:600;color:var(--amber)}
#hud .tc .eta{font-family:'IBM Plex Mono';font-size:12px;color:var(--cyan)}
#hud .tr{position:absolute;top:10px;right:10px;width:min(270px,44vw);background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px}
#hud .tr h4{margin:0 0 4px;font-family:'Bebas Neue';letter-spacing:.12em;font-size:15px;color:var(--amber)}
#hud .tr li{list-style:none;margin:2px 0;color:var(--dim)}
#hud .tr li.done{color:var(--green)}
#hud .tr li.done:before{content:'✓ '}
#hud .tr li:not(.done):before{content:'○ '}
.meter{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:3px}
.meter i{display:block;height:100%;background:var(--green);transition:width .2s}
#prompt{position:fixed;bottom:12%;left:50%;transform:translateX(-50%);z-index:12;background:rgba(0,0,0,.75);border:1px solid var(--amber);padding:8px 16px;border-radius:6px;font-size:14px;pointer-events:none;white-space:nowrap}
#prompt kbd{background:var(--amber);color:#000;border-radius:3px;padding:0 6px;font-weight:800;margin-right:6px;font-family:'IBM Plex Mono'}
#toasts{position:fixed;left:12px;top:64px;z-index:70;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:min(360px,80vw)}
.toast{background:rgba(8,10,14,.92);border-left:3px solid var(--amber);padding:7px 12px;border-radius:4px;font-size:12px;animation:tin .3s ease}
.toast b{display:block;font-family:'Bebas Neue';letter-spacing:.12em;font-size:14px}
@keyframes tin{from{transform:translateX(-20px);opacity:0}}
/* modal */
#modal{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:10px}
.talk{display:grid;grid-template-columns:150px 1fr;gap:16px;max-width:860px}
.talk .who{text-align:center}
.talk .who canvas{width:140px;height:140px;border-radius:8px;border:1px solid var(--line);background:#111}
.talk .who h3{font-size:24px;margin-top:6px}
.talk .who small{color:var(--amber);letter-spacing:.2em;font-size:10px}
.talk .who p{font-size:11px;color:var(--dim)}
.hist{max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;background:rgba(0,0,0,.3);font-size:14px;margin-bottom:10px}
.hist .l{margin:5px 0}.hist .l.you{color:var(--cyan)}
.hist .l .s{font-weight:800;margin-right:6px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:9px 12px;border-radius:6px;font-size:14px}
.opt:hover{border-color:var(--amber);background:rgba(255,182,39,.1)}
.opt .k{display:inline-block;min-width:22px;margin-right:12px;white-space:nowrap;color:var(--amber);font-family:'IBM Plex Mono';font-weight:600}
.opt.asked{opacity:.5}
.opt.ev{border-left:3px solid var(--cyan)}
.opt.agg{border-left:3px solid var(--red)}
.opt.radio{border-left:3px solid var(--green)}
.opt.calm{border-left:3px solid #b48bff}
.tagc{font-size:9px;letter-spacing:.12em;padding:2px 6px;border-radius:3px;font-weight:800;text-transform:uppercase;white-space:nowrap}
/* computer */
.pc{display:grid;grid-template-columns:180px 1fr;gap:0;padding:0;overflow:hidden;max-width:1000px;height:min(640px,90vh);font-family:'IBM Plex Mono',monospace;background:#0a1410;border-color:#1f4d3a}
.pc nav{background:#06100c;border-right:1px solid #1f4d3a;padding:10px;display:flex;flex-direction:column;gap:4px}
.pc nav .hd{color:#45e08a;font-size:11px;letter-spacing:.2em;margin-bottom:8px}
.pc nav button{background:none;border:1px solid transparent;text-align:left;padding:7px 8px;border-radius:4px;color:#9fd8bb;font-size:12px}
.pc nav button.on{border-color:#45e08a;color:#fff;background:rgba(69,224,138,.1)}
.pc .body{padding:14px;overflow:auto;color:#cfeedd;font-size:13px}
.pc .body h3{font-family:'Bebas Neue';color:#45e08a;font-size:24px;margin-bottom:6px}
.pc .row{border:1px solid #1f4d3a;border-radius:4px;padding:8px;margin:6px 0;cursor:pointer;background:rgba(0,0,0,.25)}
.pc .row:hover{border-color:#45e08a}
.pc .row.read{opacity:.8}
.pc .row .ts{color:#7fb59a;font-size:11px}
.pc .row .det{display:none;margin-top:6px;color:#fff;font-size:12px;border-top:1px dashed #1f4d3a;padding-top:6px}
.pc .row.open .det{display:block}
.pc .red{background:#000;color:#ff4d5e;padding:1px 6px;letter-spacing:.1em}
/* sting */
#sting{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,.9fr);gap:12px;padding:40px 12px 12px;height:54vh;background:linear-gradient(180deg,transparent,rgba(4,6,10,.9) 14%,rgba(4,6,10,.96))}
#sting .col{background:rgba(10,13,19,.8);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;min-height:0}
#sting h4{margin:0 0 6px;font-family:'Bebas Neue';letter-spacing:.14em;color:var(--amber);font-size:15px;font-weight:400}
#stTrans .l{font-size:12px;margin:4px 0;color:var(--dim)}
#stTrans .l b{color:var(--txt)}
#stTrans .l.team b{color:var(--green)}
#stTrans .l.you b{color:var(--cyan)}
#stWho{font-family:'Bebas Neue';letter-spacing:.2em;color:var(--red);font-size:16px}
#stLine{font-size:clamp(15px,2.2vw,20px);min-height:2.6em;margin:2px 0 8px;line-height:1.35}
#stTimer{height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-bottom:8px}
#stTimer i{display:block;height:100%;background:var(--amber);width:100%}
#stTimer.low i{background:var(--red)}
#stChoices .opt{font-size:13px;padding:7px 10px}
.evchip{display:inline-block;font-size:10px;padding:3px 6px;margin:2px;border-radius:3px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.evchip.hl{border-color:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.stat{font-size:11px;margin:5px 0;color:var(--dim)}
.stat b{color:var(--txt)}
/* police call */
#call{position:fixed;inset:0;z-index:25;background:radial-gradient(circle at 50% 30%,rgba(10,20,34,.86),rgba(2,4,8,.97));display:flex;flex-direction:column;align-items:center;padding:14px 10px;gap:12px;overflow:auto}
#call:before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none}
#callPanels{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.cp{width:clamp(104px,16vw,160px);border:2px solid #23384f;background:#08121d;border-radius:4px;transition:.2s;opacity:.55;filter:saturate(.4);position:relative}
.cp.on{opacity:1;filter:none;border-color:var(--cyan);box-shadow:0 0 22px rgba(63,208,255,.45);transform:translateY(-3px)}
.cp canvas{width:100%;aspect-ratio:1;display:block}
.cp .np{font-family:'IBM Plex Mono';font-size:10px;padding:4px 6px;background:#0d1d2e;border-top:1px solid #23384f}
.cp .np b{display:block;font-size:12px;color:#fff}
.cp .np span{color:var(--cyan)}
.cp.absent canvas{opacity:.25}
.cp .live{position:absolute;top:5px;left:5px;font-family:'IBM Plex Mono';font-size:9px;background:var(--red);color:#fff;padding:1px 5px;border-radius:2px;display:none}
.cp.on .live{display:block}
#radio{width:min(900px,100%);border:1px solid #23384f;background:rgba(4,12,20,.9);border-radius:6px;padding:10px 12px;font-family:'IBM Plex Mono'}
#radio .top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--cyan);gap:8px}
#radio .state{padding:2px 8px;border:1px solid var(--cyan);border-radius:2px;letter-spacing:.2em}
#radio .state.tx{background:var(--cyan);color:#001}
#wave{width:100%;height:56px;display:block;margin:8px 0}
#radioTxt{min-height:3.4em;font-size:clamp(14px,2vw,17px);color:#fff;line-height:1.4}
#radioTxt .sp{color:var(--amber);font-weight:600;margin-right:8px}
#radioPrev{font-size:11px;color:var(--dim);max-height:4.5em;overflow:hidden}
#callChoices{width:min(900px,100%)}
#callChoices .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#callTimer{height:5px;background:rgba(255,255,255,.1);margin:6px 0;border-radius:3px;overflow:hidden}
#callTimer i{display:block;height:100%;background:var(--amber)}
/* results */
.res h2{font-size:clamp(34px,6vw,60px);color:var(--amber)}
.res .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.res ul{padding-left:18px;margin:4px 0}
.res li{margin:3px 0;font-size:13px}
.res .sc{display:grid;grid-template-columns:150px 1fr 60px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
.res .note{font-size:11px;color:var(--dim);border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
/* customise */
.cust{display:grid;grid-template-columns:260px 1fr;gap:18px}
.cust>div:first-child{position:sticky;top:0;align-self:start;z-index:3;background:var(--panel);padding-bottom:4px}
.cust canvas{width:240px;height:280px;background:radial-gradient(circle,#24303f,#0b0e14);border-radius:10px;border:1px solid var(--line)}
.cust label{display:block;font-size:11px;letter-spacing:.2em;color:var(--dim);margin:10px 0 4px}
.cust input{width:100%;background:#0c1017;border:1px solid var(--line);color:#fff;padding:9px;border-radius:6px;font:inherit}
.sel{display:flex;align-items:center;gap:8px}
.sel span{flex:1;text-align:center;font-weight:600}
.embs{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,56px));gap:8px}
.embs canvas{width:100%;aspect-ratio:1;height:auto;border-radius:50%;cursor:pointer;border:2px solid transparent;background:none}
.embs canvas.on{border-color:var(--amber)}
.ach{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:6px;margin:5px 0}
.ach .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#222;font-size:18px}
.ach.got .ic{background:var(--amber);color:#000}
.ach small{color:var(--dim);display:block}
#debug{position:fixed;left:8px;top:64px;z-index:80;background:rgba(0,0,0,.82);color:#9f9;font:11px/1.35 'IBM Plex Mono',monospace;padding:8px;border:1px solid #2a5;max-width:360px;max-height:80vh;overflow:auto;white-space:pre-wrap;pointer-events:none}
/* touch */
#touch{position:fixed;inset:0;z-index:15;pointer-events:none}
#touch .b{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;background:rgba(255,182,39,.25);border:2px solid var(--amber);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
#touch .b.off{opacity:.3}
#joy{position:absolute;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;border:2px solid rgba(255,255,255,.25);pointer-events:auto;background:rgba(255,255,255,.05)}
#joy i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.35)}
@media (max-width:760px),(max-height:500px){#modal:not(.hidden)~#toasts{display:none}}
@media (max-width:760px),(max-height:500px){
 #hud .tl{max-width:calc(100vw - 150px);padding:4px 10px 4px 4px;gap:7px}
 #hud .tl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100vw - 230px)}
 #hud .tl small{font-size:9px;letter-spacing:.14em;white-space:nowrap}
 #hud .tc{left:auto;right:10px;transform:none;padding:3px 10px}
 #hud .tc .clk{font-size:16px}
 #hud .tc .eta{font-size:10px}
 #hud .tr{top:58px;width:min(230px,50vw);font-size:11px;padding:6px 8px}
}
@media (max-width:760px){
 #sting{grid-template-columns:1fr;height:62vh;padding-top:30px}
 #sting .c1{display:none}
 #sting .c3{max-height:120px}
 .talk{grid-template-columns:1fr}.talk .who canvas{width:80px;height:80px}
 .pc{grid-template-columns:1fr;height:92vh}.pc nav{flex-direction:row;flex-wrap:wrap}
 .cust,.res .grid2,#callChoices .grid{grid-template-columns:1fr}
 .cust>div:first-child{text-align:center;padding-top:2px}.cust canvas{width:150px;height:175px}.cust>div:first-child p{display:none}
 #hud .tr{display:none}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden"></div>
<div id="prompt" class="hidden"></div>
<div id="sting" class="hidden">
 <div class="col c1"><h4>Transcript</h4><div id="stTrans"></div></div>
 <div class="col c2"><div id="stWho">THE MARK</div><div id="stLine"></div><div id="stTimer"><i></i></div><div id="stChoices" class="opts"></div></div>
 <div class="col c3"><button class="btn" id="stEvBtn" style="width:100%;margin-bottom:8px;font-size:12px;padding:7px">📁 Review evidence (pauses)</button><h4>Encounter</h4><div id="stStatus"></div><h4 style="margin-top:8px">Objectives</h4><div id="stObj"></div><h4 style="margin-top:8px">Evidence</h4><div id="stEv"></div></div>
</div>
<div id="call" class="hidden">
 <div id="callPanels"></div>
 <div id="radio"><div class="top"><span id="rCall">CH 4 — LOCAL UNIT</span><span id="rSig">▂▄▆█</span><span class="state" id="rState">CONNECTING</span></div><canvas id="wave"></canvas><div id="radioPrev"></div><div id="radioTxt"></div></div>
 <div id="callChoices"></div>
</div>
<div id="modal" class="hidden"></div>
<div id="phase"><div class="n"></div><div class="t"></div></div>
<div id="fade"></div>
<div id="toasts"></div>
<div id="debug" class="hidden"></div>
<div id="touch" class="hidden"><div id="joy"><i></i></div><div class="b" id="tA" style="right:24px;bottom:40px">USE</div><div class="b" id="tR" style="right:100px;bottom:24px">PHONE</div><div class="b off" id="tSt" style="right:56px;bottom:118px;width:70px;height:70px;border-color:#ff4d5e;background:rgba(255,77,94,.25)">STING</div><div class="b" id="tP" style="left:12px;top:64px;width:42px;height:42px;font-size:11px">II</div></div>
<div id="screens"></div>
<script>

/* ================= BRIEFING CHARACTERS & DIALOGUE ================= */
let BRIEF={
 founder:{name:'Del',role:'The Founder',bio:'Runs the team. Ex-youth worker. Dry, procedural, allergic to drama.',topics:[
  {id:'job',q:'What\'s the job tonight?',a:'Simple on paper. We watch who turns up, we confirm what we can, we talk to him calmly, and we hand everything to the police. Police decide what happens. Not us.'},
  {id:'plan',q:'Talk me through the plan.',a:'Head down the high street. The account said the Golden Fryer, about 18:35. Watch him arrive and note the time. If there\'s a car, look at the plate. Pick your moment to talk to him. When you want police, radio me — they\'re about twenty seconds out.'},
  {id:'prove',q:'What can we actually prove?',a:'That an account said certain things to a profile that gave its age. That\'s it. Who was holding the phone? That\'s what tonight is about. Don\'t overclaim.'},
  {id:'rules',q:'Any rules I need to know?',a:'No hands. No blocking doorways. No threats. If he wants to walk, he walks. Grab anyone and I pull the plug, full stop.',sets:['rules']},
  {id:'redact',q:'Why is that message redacted?',req:['r_flagged'],a:'Because it\'s evidence, not content. The export is preserved untouched for the police. Nobody needs to read it out on a high street.'},
  {id:'hack',q:'What if he says the account was hacked?',req:['r_hacked'],a:'Then ask sensible questions. When? Did he report it? Who else uses his phone? It might even be true. We don\'t know — so we don\'t pretend we do.'},
  {id:'link',q:'How sure are we the page is his?',a:'Not sure at all. Jas matched it from the car and the Thursday check-ins. It fits, but plenty of people drive silver estates and get chips on a Thursday. Treat it as a lead. Tonight is about seeing whether the man who turns up matches it.'},
  {id:'unk',q:'What don\'t we know yet?',a:'Who typed the messages. Whether the Facebook page is even him. The full plate. Write down what you see, not what you assume.'}]},
 decoy:{name:'Jas',role:'The Decoy',bio:'Runs the profile from here. Sharp, tired, meticulous with timestamps.',topics:[
  {id:'start',q:'How did the chat start?',a:'He messaged first — 14th of September, just after seven. Small talk. Was I local, that kind of thing.'},
  {id:'age',q:'Who brought up age?',a:'I did, three minutes in. The profile says fourteen and I said it in the chat. He acknowledged it a minute later and carried on. It\'s all in the export.',intel:['log_age']},
  {id:'meet',q:'How did the meeting get arranged?',a:'He suggested it. Golden Fryer, Thursday, about 6:35. I never pushed for it — check the timestamps if you don\'t believe me.',intel:['meet_arranged']},
  {id:'face',q:'Did you ever see his face?',a:'No. No calls, no video. The only picture is the car. So I can\'t tell you it\'s him. That\'s your job tonight.'},
  {id:'carp',q:'Tell me about the car photo.',req:['r_car'],a:'Sent it on the 16th, showing off. Silver estate. You can make out “K7” in the middle of the plate. The rest is cropped.'},
  {id:'found',q:'How did we find his Facebook page?',a:'The car, mostly. He sent the photo on the 16th — silver estate, “K7” on the plate. I searched for pages with a matching car and found one with a “new motor” post and Thursday check-ins at the Golden Fryer. That\'s the place he suggested. It\'s a lead. It isn\'t proof it\'s him.'},
  {id:'where',q:'Where will you be tonight?',a:'Right here, on the team channel. I\'m not going anywhere near him. That\'s the point.'}]},
 stranger:{name:'Maureen',role:'The Concerned Stranger',bio:'Lives on the estate. Chatty, kind, careful to say what she actually saw.',topics:[
  {id:'saw',q:'What have you seen yourself?',a:'With my own eyes? A fella in a grey coat. Silver estate, parks right outside the Golden Fryer. Thursdays, half six-ish, regular as clockwork.',intel:['stranger_seen']},
  {id:'why',q:'Why did you come to us?',a:'Screenshots were going round the estate group, people calling him all sorts. I recognised the car. Thought someone sensible should look at it properly, not a mob.',intel:['group_allegation']},
  {id:'else',q:'Heard anything else about him?',a:'Well — my cousin reckons he\'s “done this before”. But I\'ll be honest with you, love, I didn\'t see that. She heard it from someone at bingo.',intel:['stranger_hearsay']},
  {id:'fb',q:'Is this the man from the Facebook page?',req:['r_social'],a:'Could be. Same sort of coat. I wouldn\'t swear to it, not off that photo. I\'m not putting my name to a guess.'},
  {id:'plate',q:'Did you ever see his number plate?',req:['r_car'],a:'His plate? No. Why would I look at a plate? I just know the car.'}]},
 vet:{name:'Ray',role:'The Team Veteran',bio:'Ex-security, years on the team. Quiet, patient, never in a hurry. Gives straight advice.',topics:[
  {id:'police',q:'When should I ring the police?',a:'Ring after your first question or two — not before. They need about twenty seconds once you call, so ringing before you\'ve spoken to him starts the clock while you\'re still getting your first answer, and you end up without enough on record. Get one or two statements first, then ring, so they turn up as you\'re finishing. Don\'t tell him they\'re coming unless he asks.'},
  {id:'moment',q:'When is the best time to speak to him?',a:'When he\'s ordered and is waiting for his food. He\'s stuck there, he\'s relaxed, and he\'ll put up with a few questions. In the queue, before he\'s ordered, you\'ll get a couple of questions before he gets twitchy — ring after your first answer if you want to keep going. Out on the street, away from the takeaway, you only get one question before he runs unless the police are already coming, and he\'ll say he\'s going for a walk. And once he\'s heading back to the car you get two answers before he panics. Pick your moment.'},
  {id:'evidence',q:'What evidence should I be gathering?',a:'Three things. One: that he turned up, and when — watch him arrive, don\'t guess. Two: the car. Walk up to it while it\'s parked and look at the plate. Three: his own words, and what they match against the chat log. Add those to what\'s on the computer and you\'ve got something. Skip any one and your report gets thin.'},
  {id:'weight',q:'How much does each bit of evidence count for?',a:'What you see yourself and what\'s verified counts most. What he tells you is a statement — useful, but only his word. Maureen\'s cousin\'s bingo story is hearsay, and a Facebook group is allegation. Log them, but don\'t lean on them. A partial plate, “K7”, is a lead, not a match.'},
  {id:'calm',q:'How do I keep him calm?',a:'Slowly. Every question costs you some of his patience, so don\'t fire them off. Start easy — Thursdays, his food, what brings him here. Save the awkward ones for later. Never open with an accusation. If his suspicion is climbing, ease off, and let him answer without cutting in. The clock\'s on your side if you\'re calm.'},
  {id:'discreet',q:'How do I stay discreet?',a:'Don\'t hover and don\'t stare. Keep a few metres back and look like you\'re waiting for a bus. Don\'t follow him round the shop or stand on his shoulder — people notice that, and so will he. Don\'t shout across the street. Use your phone to ring the police, quietly. If he\'s edgy, back off and come at it again in a minute.'},
  {id:'run',q:'What if he tries to run?',a:'Let him. No hands, no blocking the door, no standing in front of the car. If he drives off, step clear — he\'ll be quicker leaving than he was arriving. Make a note of what you saw and say it straight. If you grab him, the night\'s over and you\'re the one in trouble.'},
  {id:'confess',q:'If he admits it, is that enough?',a:'No. Nothing he says on a high street decides it on its own — neither a confession nor a slip-up. What counts is everything together: the chat log, the age that was stated, the meeting he arranged and turned up to, and whether the man in front of you is the same one behind the account. Police weigh that, not us.'},
  {id:'report',q:'What do I say to the police at the end?',a:'Only what you know, and say how you know it. “I saw him arrive at half six, I checked the plate, he told me this.” Don\'t pad it. Calling hearsay fact, or saying something you only assumed, costs you more than leaving it out.'},
  {id:'phone',q:'Can I get hold of you during the mission?',a:'Any time. Open your phone, hit “Ask Ray for advice”, and I\'ll tell you what I\'d do right now, given where he is. You can also call Del, ring the police, or open the evidence file. You can also open the evidence file — the clock stops while you read it, so use it. Check what you\'ve actually got before you walk over.'},
  {id:'mess',q:'What if it all goes wrong?',a:'It happens. Everything you do in this room is saved when you step out the door. If the approach falls apart you can go again from that point with the same notes, or start the whole night over. Learn what spooked him and try a different order.'}]}
};

const SCORE_MAX={evidence:30,timeline:15,followups:18,accuracy:20,escalation:20,objectives:17};
function computeScore(){const s={};

 const strongC=CONTRAS.filter(c=>M.contras.has(c.id)).reduce((a,c)=>a+(c.weak?1:3),0);
 s.followups=Math.min(18,M.goodQs+strongC);
 s.accuracy=clamp(M.accPts-6*M.overstate,0,20);
 s.escalation=clamp(M.escalation+10-M.aggression*4-M.conduct*10-4*(M.wrongMen|0),0,20);
 const obj=[M.read.size>=8,!!M.attendedTime,hasIntel('admit_car')&&(hasIntel('obs_car_exit')||hasIntel('car_scene')),M.statements.length>=3,M.overstate===0&&STATE!=='MISSION_FAILED',M.aggression===0&&M.conduct===0];
 s.objectives=Math.min(17,obj.filter(Boolean).length*3-(obj.every(Boolean)?1:0));
 s.total=Object.keys(SCORE_MAX).reduce((a,k)=>a+s[k],0);s.max=Object.values(SCORE_MAX).reduce((a,b)=>a+b,0);return s;}

 const c3=()=>{closeModal();openEvidence();};

 ACTIVE_CHOICES=[a,b,c3,d5];$('ph1').onclick=a;$('ph2').onclick=b;$('ph3').onclick=c3;$('ph5').onclick=d5;$('ph4').onclick=closeModal;}
function vetTip(){if(CASE==='ho')return vetTipHo();if(CASE==='st')return vetTipSt();if(CASE==='pub')return vetTipPub();if(CASE==='cp')return vetTipCP();const pol=M.police,st=mark&&mark.stage;M.vetSaid=M.vetSaid||new Set();M.vetN=(M.vetN|0)+1;
 const seen=M.seenMark&&mark.present&&st!=='ABSENT',L=[];
 if(pol.requested){L.push(['p1','Police are on their way. Keep it slow and calm, ask the easy questions, and don\'t mention them unless he asks.'],['p2','Don\'t crowd him and keep clear of his car. You\'re just a person having a chat.'],['p3','When they arrive, tell them what you saw and what he said — and say which is which.']);}
 else if(!seen){L.push(['w1','Be patient. Stand near the takeaway and watch for a silver estate. Note the time he arrives.'],['w2','While you wait, open the evidence file on your phone and get your questions straight. The clock stops while you read.'],['w3','Stay a few metres back, look like you\'re waiting for a bus.']);}
 else if(st==='WALKING')L.push(['k1','He\'s heading in. Don\'t rush him — out here he\'ll just say he\'s out for a walk. Wait until he\'s ordered.'],['k2','Keep your distance and watch where he goes. Arrival time is evidence.']);
 else if(['QUEUING','ORDERING'].includes(st))L.push(['q1','He hasn\'t ordered yet. Speak now and he\'ll bolt after a few questions. Hang back until he\'s waiting for his food.'],['q2','If you can\'t wait: ask one easy question, then ring the police.']);
 else if(['WAITING_FOOD','COLLECT'].includes(st))L.push(['f1','This is the best moment. Walk over calmly, ask an easy question or two, then ring the police.'],['f2','Start easy — Thursdays, his food. Save the awkward questions for later, and don\'t cut across his answers.'],['f3','Ask him why the chat said he\'d be here tonight. It\'s a good one now he\'s turned up.']);
 else if(['HOLDING_FOOD','LEAVING','AT_CAR'].includes(st))L.push(['l1','He\'s leaving. You only get a couple of answers — make them count, and don\'t block him.'],['l2','If he runs, let him. Step clear and write down what you saw.']);
 const out=[];
 if(!M.contact&&seen&&!pol.requested)out.push(['g1','You haven\'t spoken to him yet. You need his own words on record — pick your moment and start with something easy.']);
 if(M.contact&&M.statements.length<3)out.push(['g2','You\'ve got '+M.statements.length+' statement'+(M.statements.length===1?'':'s')+' so far. Aim for three or more before it ends.']);
 if(M.contact&&!pol.requested)out.push(['g3','You\'ve spoken to him. Ring the police now if you haven\'t — they take about twenty seconds.']);

  {id:'unk',q:'What don\'t we know yet?',a:'Who typed the messages. Whether the profile is really him. The full plate. Write down what you see, not what you assume.'}]},
 decoy:{name:'Jas',role:'The Decoy',bio:'Runs the profile from here. Sharp, tired, meticulous with timestamps.',topics:[
  {id:'start',q:'How did the chat start?',a:'He messaged first — 14th of September, just after seven. Small talk. Was I local, that kind of thing.'},
  {id:'age',q:'Who brought up age?',a:'I did, three minutes in. The profile says fourteen and I said it in the chat. He acknowledged it a minute later and carried on. It\'s all in the export.',intel:['log_age']},
  {id:'meet',q:'How did the meeting get arranged?',a:'He suggested it. Riverside Car Park, Thursday, about 6:35, on the bench by the pay machine. He said he\'d pick her up from the car park and take her back to his house. I never pushed.',intel:['meet_arranged']},
  {id:'face',q:'Did you ever see his face?',a:'No. No calls, no video. The only picture is the van. So I can\'t tell you it\'s him. That\'s your job tonight.'},
  {id:'carp',q:'Tell me about the van photo.',req:['r_car'],a:'Sent it on the 16th, showing off. Blue van. You can make out “D4” on the plate. The rest is cropped.'},
  {id:'found',q:'How did we find his profile?',a:'The van, mostly. I searched for pages with a matching blue van and found one with a “new wheels” post and Thursday check-ins at Riverside. It\'s a lead, not proof.'},
  {id:'where',q:'Where will you be tonight?',a:'Right here on the team channel. Nowhere near him. That\'s the point.'}]},
 vet:{name:'Ray',role:'The Team Veteran',bio:'Ex-security, years on the team. Quiet, patient, never in a hurry. Smokes. Gives straight advice.',topics:[
  {id:'police',q:'When should I ring the police?',a:'On contact, or just before it. He spooks fast — you won\'t get long, and they need about twenty seconds. Ring as you walk up, then ask quickly. Don\'t wait for a second question.'},
  {id:'moment',q:'Where do I find him?',a:'He parks the blue van and sits on the bench next to it. Don\'t chat to anyone near him on the way — if he sees people being questioned, he\'ll run. Go straight to him.'},
  {id:'evidence',q:'What evidence should I be gathering?',a:'The van\'s plate, him getting out of it, and his own words. The chat log does the heavy lifting. You need him to say the van\'s his, and why he\'s sitting where the account said.'},
  {id:'fast',q:'How do I use a short window?',a:'Easy ones first — his name, why he\'s here. Then the van, then the account. Skip the small talk. If he gives you something that doesn\'t fit, use it.'},
  {id:'calm',q:'He keeps saying “guys please”. Now what?',a:'Stay level. He\'ll say he\'s being harassed. Don\'t accuse, don\'t raise your voice. Every question costs him patience, so make each one count.'},
  {id:'run',q:'What if he runs?',a:'Let him. No hands, no blocking the van. Note what you saw and say it straight.'},
  {id:'report',q:'What do I say to the police at the end?',a:'Only what you know, and how you know it. “I saw him get out of the van, I checked the plate, he told me this.” Don\'t pad it.'},
  {id:'phone',q:'Can I get hold of you during the mission?',a:'Any time. Phone → Ask Ray, and I\'ll tell you what I\'d do right now. You can also ring the police from there.'}]}};

 decoy:{name:'Jas',role:'The Decoy',bio:'Runs the profile from here. Sharp, tired, meticulous with timestamps.',topics:[
  {id:'start',q:'How did the chat start?',a:'He messaged first — 3rd of October, just after eight in the evening. Small talk. Was I local, that kind of thing.'},
  {id:'age',q:'Who brought up age?',a:'I did, two minutes in. The profile says fourteen and I said it in the chat. He acknowledged it straight away and carried on. It\'s all in the export.',intel:['log_age']},
  {id:'meet',q:'How did the meeting get arranged?',a:'He suggested it. The Tipsy Swan, Friday, half seven. A table for two in the restaurant under “Bradley” — he said he\'d buy dinner and I should say I was with Bradley. I never pushed.',intel:['meet_arranged']},
  {id:'face',q:'Did you ever see his face?',a:'No calls, no video. The only picture is a selfie in a pub with football on behind him. I can\'t tell you it\'s him. That\'s your job tonight.'},
  {id:'carp',q:'Tell me about the pub selfie.',req:['r_car'],a:'Sent on the 8th. Football on a big screen, a pint, and part of a sign — you can make out “SWAN”. The rest is cut off.'},
  {id:'found',q:'How did we find his profile?',a:'The pub, mostly. I searched for pages tagging The Tipsy Swan and found one with Friday check-ins and a lot of carvery photos. It\'s a lead, not proof.'},
  {id:'where',q:'Where will you be tonight?',a:'Right here on the team channel. Nowhere near him. That\'s the point.'}]},
 vet:{name:'Ray',role:'The Team Veteran',bio:'Ex-security, years on the team. Quiet, patient, never in a hurry. Smokes. Gives straight advice.',topics:[
  {id:'queue',q:'How do I get through the door?',a:'Join the back of the queue behind whoever\'s ahead — don\'t barge. When it\'s your turn the host asks for the booking. Say “reservation for Del”. Your own name\'s not on the list, and a time on its own does nothing. He\'ll open the gate.'},
  {id:'sit',q:'Where do I wait?',a:'Table 5. Walk straight there and sit. While you\'re sat down he won\'t clock you. Stand around anywhere he can see and he\'ll be out the door.'},
  {id:'police',q:'When should I ring the police?',a:'On contact, or just before it. He won\'t stay long once he\'s seated — you\'ll only get a few answers. Ring as you walk up, then ask quickly.'},
  {id:'evidence',q:'What evidence should I be gathering?',a:'Him arriving and walking past, the reservation card on Table 7, and his own words. The chat log does the heavy lifting.'},
  {id:'fast',q:'How do I use a short window?',a:'Easy ones first — his name, why he\'s here. Then the booking, then the account. If he gives you something that doesn\'t fit, use it.'},
  {id:'run',q:'What if he runs?',a:'Let him. No hands, no blocking the door. Note what you saw and say it straight.'},
  {id:'report',q:'What do I say to the police at the end?',a:'Only what you know, and how you know it. “I saw him walk in, I read the card, he told me this.” Don\'t pad it.'},
  {id:'phone',q:'Can I get hold of you during the mission?',a:'Any time. Phone → Ask Ray, and I\'ll tell you what I\'d do right now. You can also ring the police from there.'}]}};
PUBD.INTRO=[()=>`Alright, ${P.name}. Tonight's the Tipsy Swan job — a pub, a restaurant, and a man who's booked a table for two.`,()=>'The chat log is solid. What we\'re missing is the man, and a few words from him. Check the computer, and speak to Jas about the chats.',()=>'Have a word with Ray too. The restaurant\'s gated off, and there\'s a trick to getting in. No Maureen this time.',Object.assign(()=>'Here\'s who we think he is. Bradley, 25, fade, navy bomber. Jas found him from the pub in his selfie. And that other picture… it\'s a roast dinner. Don\'t ask.',{photos:true}),()=>'It\'s all on the computer and on your phone. Table five is booked under my name. Door\'s behind you when you\'re ready — and don\'t be late, he\'ll be in within the minute.'];

 overview:()=>`<h3>Case NH-017 — Train Station</h3><p>Team: <b>${esc(P.team)}</b>. Lead: Del.</p><p><b>Objectives</b></p><ol><li>Know the chat log — it is strong.</li><li>Get a ticket from the machines on the left, or the barriers won\'t open for you.</li><li>He arrives on the <b>13:30 from Leeds, platform 5</b>. Watch the board. Leah, his ex-partner, has told us how he dresses.</li><li>Don\'t confront the wrong man — there will be lookalikes off that train.</li><li>He\'ll wait under the board. Ring the police on contact. Beware the announcements — he can\'t hear you over them, and his patience drains.</li><li>Hand over to police with an accurate report.</li></ol><p><b>Conduct</b>: no physical contact, no blocking, no threats.</p>`,
 suspect:()=>`<h3>Suspect file</h3>${SUSPECT_HTML()}`+row('sp1','<b>Name & age</b>','“Marcus T”, 34 — from a profile linked to the account, matched by the station and the Leeds–Manchester posts. A lead until the man himself turns up.',{intel:['suspect_profile'],flag:'r_social'})+row('sp2','<b>How he looks</b>','From his ex-partner, Leah: khaki parka, burgundy bobble hat, red holdall, white hi-tops. <b>Witness account — unconfirmed.</b>',{intel:['ex_desc']}),

STD.BRIEF={
 founder:{name:'Del',role:'The Founder',bio:'Runs the team. Ex-youth worker. Dry, procedural, allergic to drama.',topics:[
  {id:'job',q:'What\'s the job today?',a:'Piccadilly Central. The chat log is solid. What we need is the man himself, and a few words from him. Police decide what happens, not us.'},
  {id:'plan',q:'Talk me through the plan.',a:'He says he\'ll be on the 13:30 from Leeds, platform five, and he\'ll meet her by the big departures board. The platforms are behind ticket barriers, so buy a ticket from the machines on the west side first. Then watch the arrivals. Leah can tell you what he looks like.'},
  {id:'prove',q:'What can we actually prove?',a:'That an account said certain things to a profile that gave its age. Who was holding the phone is what today is about. Don\'t overclaim.'},
  {id:'rules',q:'Any rules I need to know?',a:'No hands. No blocking. No threats. And don\'t approach the wrong man — there are always others off a train. If you do, it costs us.',sets:['rules']},
  {id:'redact',q:'Why is that message redacted?',req:['r_flagged'],a:'Because it\'s evidence, not content. The export is preserved untouched for the police.'},
  {id:'hack',q:'What if he says the account was hacked?',req:['r_hacked'],a:'Ask sensible questions. When? Did he report it? Who else uses his phone? It might even be true — so we don\'t pretend we know.'},
  {id:'link',q:'How sure are we it\'s him?',a:'Strong lead. We matched the station and the Friday posts. But until a man steps off that train and stands under that board, it\'s still a lead.'},
  {id:'noise',q:'Anything about the station itself?',a:'It\'s loud. When there\'s an announcement or a train going, he won\'t hear you properly — and neither will you. Keep your questions for the quiet gaps.'}]},
 decoy:{name:'Jas',role:'The Decoy',bio:'Runs the profile from here. Sharp, tired, meticulous with timestamps.',topics:[
  {id:'start',q:'How did the chat start?',a:'He messaged first — 14th of October, just after eight. Small talk. Was I local, that kind of thing.'},
  {id:'age',q:'Who brought up age?',a:'I did, two minutes in. The profile says fourteen and I said it in the chat. He acknowledged it straight away and carried on. It\'s all in the export.',intel:['log_age']},
  {id:'meet',q:'How did the meeting get arranged?',a:'He suggested it. Piccadilly Central, Friday, about twenty to two, by the big board. He says he\'s on the 13:30 from Leeds. I never pushed.',intel:['meet_arranged']},
  {id:'face',q:'Did you ever see his face?',a:'No calls, no video. The only picture is a platform with the front of a train in it. I can\'t tell you it\'s him. That\'s your job today.'},
  {id:'carp',q:'Tell me about the platform photo.',req:['r_car'],a:'Sent on the 21st. The nose of a train and part of a sign — you can make out a “5”. That\'s why we think it\'s the 13:30 into platform five.'},
  {id:'found',q:'How did we find his profile?',a:'The station, mostly. Pages tagging Piccadilly Central, Leeds–Manchester posts every Friday. Then Leah got in touch. It\'s a lead, not proof.'},
  {id:'where',q:'Where will you be today?',a:'Right here on the team channel. Nowhere near him. That\'s the point.'}]},
 vet:{name:'Ray',role:'The Team Veteran',bio:'Ex-security, years on the team. Quiet, patient, never in a hurry. Smokes. Gives straight advice.',topics:[
  {id:'ticket',q:'How do I get to the platforms?',a:'Buy a ticket from a machine on the west side, by the info booth. Any ticket will do. The barriers won\'t open for you without one.'},
  {id:'who',q:'How do I tell him from the other men off the train?',a:'The hat. Burgundy bobble, if Leah\'s right. Others will be in khaki parkas too — two of them, I\'d bet. The wrong man costs you points and might spook the right one.'},
  {id:'wait',q:'Where do I wait?',a:'Somewhere you can see platform five and the board, not stood right under his nose. People who stare get noticed. Look at the departures board like everyone else.'},
  {id:'noise',q:'What about the announcements?',a:'Hold your questions until it\'s quiet. When it\'s loud he can\'t hear you, he gets twitchy, and his patience goes quicker.'},
  {id:'staff',q:'Is there anything the staff can help with?',a:'The info booth can check the platform camera. Ask politely, once the train\'s in. They can\'t show you footage, but they can tell you what they see.'},
  {id:'police',q:'When should I ring the police?',a:'On contact, or just before it. He\'ll want to get back on a train. Ring as you walk up.'},
  {id:'run',q:'What if he runs?',a:'Let him. No hands, no blocking. Note what you saw and say it straight.'},
  {id:'report',q:'What do I say to the police at the end?',a:'Only what you know, and how you know it. “I saw him step off the train, I read the tag, he told me this.” Don\'t pad it.'},
  {id:'phone',q:'Can I get hold of you during the mission?',a:'Any time. Phone → Ask Ray, and I\'ll tell you what I\'d do right now. You can also ring the police from there.'}]},
 ex:{name:'Leah',role:'His Ex-partner',bio:'Was with him for three years. Saw his photo in the appeal and came forward. Quiet, steady, and clearly here on her own terms.',topics:[
  {id:'who',q:'Who are you?',a:'Leah. I was with Marcus for three years. I saw the picture on your profile and I knew the jacket before I knew the face.'},
  {id:'why',q:'Why did you come forward?',a:'Because I recognised him, and I couldn\'t not say. I don\'t want another family finding out what I nearly didn\'t.'},
  {id:'look',q:'How does he usually dress?',a:'Khaki parka — he\'s had it for years. A burgundy bobble hat, even indoors. White hi-tops, always spotless. And a red holdall, wherever he goes.',intel:['ex_desc']},
  {id:'habits',q:'What\'s he like in public?',a:'Gets off the train phone-first. Walks straight to wherever he\'s meeting, then stands there checking the time. If anyone looks at him twice he turns it into “I\'m just waiting for a mate”.'},
  {id:'lies',q:'What will he say when you speak to him?',a:'That it\'s not him. Then that someone\'s got his phone, or it was a joke. And “my mate Dave”. There is no Dave.'},
  {id:'sure',q:'Are you sure it\'s him?',a:'I\'m sure it\'s his photo. I can\'t tell you who typed the messages. That\'s your part.'},
  {id:'age',q:'How old is he?',a:'Thirty-four. He\'ll tell you he\'s younger.'},
  {id:'ok',q:'Are you alright to be here?',a:'No. But I\'m here. I\'ll stay in this room. I don\'t want to see him.'}]}};
STD.INTRO=[()=>`Alright, ${P.name}. Today's Piccadilly Central — a big station, a lot of people, and a man arriving on the 13:30 from Leeds.`,()=>'The chat log is solid. What we\'re missing is the man, and a few words from him. Check the computer, and speak to Jas about the chats.',()=>'Have a word with Ray, and with Leah — his ex-partner. She\'s the reason we know what he looks like. Be gentle with her.',Object.assign(()=>'Here\'s who we think he is. Marcus, 34, parka and a bobble hat. Jas found him from the platform photo and the Friday posts. And that third picture is a pasty. Don\'t ask.',{photos:true}),()=>'It\'s all on the computer and on your phone. Get a ticket for the barriers, watch the board, and don\'t approach the wrong man. Door\'s behind you when you\'re ready.'];

function stTrains(dt){const clock=M.clock;
 for(const tr of ST.trains){
  if(tr.state==='WAIT'&&tr.inAt!=null&&clock>=tr.inAt){tr.state='IN';tr.v=150;noise(1.6,.12,260);}
  else if(tr.state==='IN'){const left=426-tr.yf;tr.v=clamp(left*.7,22,100);tr.yf+=tr.v*dt;if(tr.yf>=426){tr.yf=426;tr.state='PARK';tr.openAt=clock+1.8;SFX.door();}}
  else if(tr.state==='PARK'){
   if(tr.openAt!=null&&clock>=tr.openAt){tr.openAt=null;tr.open=true;SFX.door();if(tr.id==='A')stSpawnA();else if(tr.id==='E')stAlight(tr);}
   if(tr.outAt!=null){if(clock>=tr.outAt-6&&tr.open){tr.open=false;SFX.door();}if(clock>=tr.outAt){tr.state='OUT';tr.v=18;noise(1.4,.1,240);}}}
  else if(tr.state==='OUT'){tr.v=Math.min(150,tr.v+46*dt);tr.yf-=tr.v*dt;if(tr.yf<=60){tr.state='GONE';}}}}

function stMarkUpdate(dt){const m=mark,st=m.stage;

  const done=stepPath(m,dt);

  return;}
 if(st==='WAITING'){m.moving=false;m.onPhone=((M.clock-m.waitAt)%15)<9;
  if(!M.attendedTime&&dist(player,m)<300&&stZone(player)==='con'){M.attendedTime=fmtClock(M.clock,false);addIntel('attended');}

  return;}

PUBD.INTEL.two_decoys={title:'Lantern Unit (another nonce-hunting team): their own decoy profile has also been messaged by this account — “two decoys on him”',src:'Rival team Lantern Unit, relayed — logs not yet seen',conf:'HEARSAY'};
ITEM_REACT.two_decoys='Two decoys on one account would matter a lot — but until someone has seen both sets of logs, it\'s relayed from another team, not verified. Fair to log it that way.';
PUBD.BRIEF.lawf={name:'Priya',role:'Lantern Unit',bio:'Runs a decoy profile for Lantern Unit, a rival nonce-hunting team working the same target. Calm, precise, reads every message twice. Wears the green team hoodie.',topics:[
 {id:'who',q:'Who are you two?',a:'Priya, and this is Tom. We\'re Lantern Unit — another nonce-hunting team. We\'ve been working this man for a few weeks from our side. Del knows we\'re here.'},
 {id:'two',q:'Anything we should know about Bradley O?',a:'We\'ve got a decoy on him too. Not Jas\'s profile — ours. The same account has been messaging a second profile, run by us. Different profile, same wording, same pub.',intel:['two_decoys']},
 {id:'rely',q:'Can I rely on your decoy\'s logs?',req:['t_lawf_two'],a:'You can tell the police they exist. You can\'t say you\'ve seen them — you haven\'t. We\'ll hand them over ourselves. Report it as exactly that — relayed from another team, not verified.'},
 {id:'golden',q:'What\'s the plan between our two teams?',a:'Keep out of each other\'s way. Two teams on one man is how evidence gets muddied. You make contact tonight; we stay in here, and we don\'t go near him.'}]};
PUBD.BRIEF.lawm={name:'Tom',role:'Lantern Unit',bio:'Lantern Unit\'s evidence lead. Dry. Thinks \"basically\" is a dangerous word, and likes his logs timestamped.',topics:[
 {id:'job',q:'What\'s your part tonight?',a:'Watching, mostly. We\'ve got our own logs on him. If your night goes well, the police will want both sets side by side.'},
 {id:'proof',q:'What actually counts as proof?',a:'His own words. Things you saw yourself. Preserved records. A hunch isn\'t proof, a lookalike isn\'t proof, and a matching surname is a lead. Same for both our teams.'},
 {id:'hack',q:'What if he says the account was hacked?',a:'Then you ask when, and whether he reported it. You don\'t argue and you don\'t decide. That\'s for an interview.'},
 {id:'second',q:'Tell me about your decoy on him.',req:['t_lawf_two'],a:'Ours, not yours. We\'ll pass our logs to the police. Don\'t promise him anything and don\'t mention our team unless he does — we don\'t want him knowing there are two of us.'}]};
