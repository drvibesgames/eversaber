const QUESTS=[['lab','Main Quest \u2013 Retake the Lab','Hack the laser fence \u2014 Neon Sprawl','Questing XP',3],['big','Main Quest \u2013 Bigger They Are...','Enter the Foundry','Questing XP',3],['came','Main Quest \u2013 We Came, We Saw','Reach Frostpeak Outpost','Questing XP',3],['faith','Leap of Faith','Mother Silt \u2014 Mirehold Chapel','Focus Band',3],['tut2','Basic Training Part Two','Prospector Gage \u2014 Dunewell Town','A free level in a skill of your choice',3],['tut','Basic Training Part One','Instructor Tamsin \u2014 Outpost Kessa','\u20b5250, 3 Healing Pods',3],['melt','Meltdown','Foreman Rusk \u2014 The Foundry','Slag-Forged Chestplate, \u20b56,000',3],['emer','Main Quest \u2013 Emerald of the Mire','Bog Warden \u2014 Mirehold','Swamp Emerald (opens the hub vault)',3],['cure','Swamp Fever','Injured man \u2014 Mirehold Infirmary','\u2605 Dart of Destruction',2],['sting','Main Quest \u2013 Sting in the Deep','Elder Varo \u2014 Dunewell Town','Venom Pistol, \u20b5500',3],['caged','Caged','Mara \u2014 Dunewell Town','Healzooka, \u20b5300',3],['brawl','Bar Brawl','Brakk \u2014 The Dusty Flagon','Red Bandana',3],['pods','Pod Hunt','The Wanderer \u2014 Dunewell Town','\u20b52,000',3],['nuts','Nut Cracker','The Wanderer \u2014 Dunewell Town','Snowveil Ninja Hood',3],['hotel','Room with a View','Hotel Concierge \u2014 Neo-Haven','Unlimited Hotel Room Ticket',5],['corrupt','Paper Trail','Dex \u2014 outside Neo-Haven Town Hall','Hybrid Servo Legs',3]];
function src(i){if(RCP.some(r=>r.item===i))return 'crafted';if(i.boss)return `Very rare drop: ${ENEMY[i.boss].n} (1/${BDROP_RATE})`;if(PREMIUM.some(p=>p.it===i))return 'Vanta, Neo-Haven Armory';if(HUBSHOP.some(p=>p.it===i))return 'Kira, Orbital Hub Aster';if(WSHOP.some(p=>p.it===i))return 'The Wanderer, Dunewell';if(i.slot==='cape')return 'Cape Merchant, Dunewell (level 99)';return {'Venom Pistol':'Quest: Sting in the Deep','Focus Band':'Quest: Leap of Faith (Mirehold Chapel)','Slag-Forged Chestplate':'Quest: Meltdown','Healzooka':'Quest: Caged','Red Bandana':'Quest: Bar Brawl','Snowveil Ninja Hood':'Quest: Nut Cracker','Hybrid Servo Legs':'Quest: Paper Trail','Hybrid Servo Chestplate':'??? (hidden somewhere in Neo-Haven)','Red Trench Coat':'Hotel suite chest (after Room with a View)','Wellspring Flail':'??? (a secret in Dunewell Mine)','Dart of Destruction':'Quest: Swamp Fever','Twin Reaver Chainsaws':'Rare drop: Reaper Endoskeleton (1/30)','Skyfall Beacon':'Rare drop: Bog Lurker (1/25)','Cryo Talons':'Rare drop: Cryo Sentinel (1/25), Frostpeak Outpost','Stormcaller Bolt':'Rare drop: Infiltrator Guardian (1/4) \u2014 or hit green at the Aster Casino roulette','Tempest Top':'Rare drop: Robo-Hound (1/35)','Golden Spikes Hairdo':'??? (someone quiet on Orbital Hub Aster)','Rosethorn Morning Star':'Wrapped Stranger, Neon Sprawl','Crimson Neon Shuriken':'Crimson Ninja, The Foundry'}[i.n]||'special'}
function skillGuide(sk){const L=lvl(S[sk]),rows=[];let head='<tr><th>Lv</th><th>Training spot</th><th>Location</th><th>Reward</th></tr>';
 let h=`<h2 style="color:${SKCOL[sk]}">${cap(sk)} guide</h2><div>Your level: <b>${L}</b> \u00b7 ${S[sk].toLocaleString()} XP \u00b7 XP rate \u00d7${XPM*mult}</div>`;
 if(sk==='melee'||sk==='ranged'){const m=locsOf(o=>o.t==='enemy');Object.keys(m).forEach(k=>{const E=ENEMY[k];rows.push([E.lv,`${E.n} <i>(${E.hp} HP)</i>`,[...m[k]].join(', '),`~${Math.round(E.hp*4*XPM)} XP per kill`])})}
 if(sk==='hacking'){const m=locsOf(o=>o.t==='term');Object.keys(m).forEach(k=>{const d=TERM[k];rows.push([d.req,d.n,[...m[k]].join(', '),`${Math.round(d.xp*XPM)} XP \u00b7 \u20b5${d.cr[0]}\u2013${d.cr[1]}${d.heal?' \u00b7 heals you':''}`])});objs.filter(o=>o.t==='gate').forEach(o=>rows.push([o.req,o.n+' <i>(one-off)</i>',locName(o.x,o.y),`${Math.round(o.xp*XPM)} XP \u00b7 opens the way`]))}
 if(sk==='mining'){const m=locsOf(o=>o.t==='ore');Object.keys(m).forEach(k=>{const R=ORES[k];rows.push([R.lv,`<span style="color:${R.col}">${R.n}</span> rock`,[...m[k]].join(', '),`${Math.round(R.xp*XPM)} XP`])})}
 if(sk==='gathering'){const m=locsOf(o=>o.t==='plant');Object.keys(m).forEach(k=>{const P=PLANTS[k];rows.push([P.lv,`<span style="color:${P.col}">${P.n}</span>`,[...m[k]].join(', '),`${Math.round(P.xp*XPM)} XP \u00b7 ${P.item} heals ${P.heal}`])})}
 if(sk==='crafting'){head='<tr><th>Lv</th><th>Recipe</th><th>Station</th><th>Needs</th></tr>';RCP.forEach(r=>rows.push([r.lv,r.bar?matName(r.bar):r.item.n,r.at==='furnace'?'Furnace \u2014 Dunewell Forge / Hub Plasma Forge':'Workbench \u2014 Outpost / Dunewell / Orbital Hub',Object.entries(r.need).map(([k,n])=>n+' '+matName(k).toLowerCase()).join(', ')+(r.cr?', \u20b5'+r.cr:'')+` \u00b7 ${Math.round(r.xp*XPM)} XP`]))}
 if(sk==='focus'){head='<tr><th>Lv</th><th>Bones / ritual</th><th>Source</th><th>Reward</th></tr>';const m=locsOf(o=>o.t==='enemy');Object.keys(BONES).forEach(k=>rows.push([1,`<span style="color:${BONES[k].c}">${BONES[k].n}</span>`,ENEMY[k].n+(m[k]?' \u2014 '+[...m[k]].join(', '):''),`${Math.round(BONES[k].xp*XPM)} XP buried \u00b7 sells \u20b5${BONES[k].cr}`]));RIT.forEach(r=>rows.push([r.lv,`<b style="color:${r.col}">${r.n}</b>`,'Focus tab',`${r.d} \u00b7 drains ${r.dr}/s`]));TM.forEach(([a,b2,lv,c])=>rows.push([lv,`Transmute: 2 ${PLANTS[a].item} \u2192 1 ${PLANTS[b2].item}`,'Focus tab',`costs ${c} focus`]));rows.sort((a,b)=>a[0]-b[0]||(a[3]>b[3]?1:-1))}
 if(sk==='mining')DRILLS.forEach(D=>rows.push([D.lv,`<span style="color:${D.c}">\u26cf ${D.n}</span> <i>(tool)</i>`,D.i?'Craft at a workbench (upgrade of the '+DRILLS[D.i-1].n+')':'You start with it',D.i?Object.entries(D.need).map(([k,n])=>n+' '+matName(k).toLowerCase()).join(', '):'\u2014']));
 if(sk==='bounty'){head='<tr><th>Lv</th><th>Possible mark</th><th>Location</th><th>Reward</th></tr>';const m=locsOf(o=>o.t==='enemy');Object.keys(ENEMY).filter(k=>!['brakk','pip','king','colossus','skull'].includes(k)).forEach(k=>{const E=ENEMY[k];rows.push([Math.max(1,E.lv-12),E.n+` <i>(lv ${E.lv})</i>`,m[k]?[...m[k]].join(', '):'\u2014',`${Math.round((E.lv*.6+2)*XPM)} XP per kill \u00b7 ~${Math.max(4,Math.round(9*E.lv/20))} pts per contract`])})}
 if(sk==='questing'){head='<tr><th>Done</th><th>Quest</th><th>Starts with</th><th>Reward</th></tr>';[...QUESTS].sort((a,b)=>QORD.indexOf(a[0])-QORD.indexOf(b[0])).forEach(([id,n,st,rw,fin])=>rows.push([pl.q[id]>=fin?'\u2714':pl.q[id]?'\u2026':'\u2014',n,st,rw]))}
 if(sk!=='questing')rows.sort((a,b)=>a[0]-b[0]);
 h+=`<h4>Training spots</h4><table>${head}${rows.map(r=>`<tr class="${typeof r[0]==='number'&&L<r[0]?'no':''}"><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table>`;
 const list=Object.values(ITEMS).filter(i=>(sk==='focus'&&i.fp)||i.cls===sk||(i.bonus&&i.bonus[sk])||i.skill===sk||(sk==='crafting'&&RCP.some(r=>r.item===i))).sort((a,b)=>(a.lv||(a.skill?99:0))-(b.lv||(b.skill?99:0)));
 h+=`<h4>Gear</h4><table><tr><th>Lv</th><th>Item</th><th>Slot</th><th>Stats \u00b7 source</th></tr>${list.map(i=>`<tr class="${(i.lv&&L<i.lv)||(i.skill&&L<99)?'no':''}"><td>${i.lv||(i.skill?99:'\u2014')}</td><td style="color:${i.leg?'#ffd700':['demon','ninja','robin','abyss','cyborg'].includes(i.look)?'#fff':i.col}">${i.leg?'\u2605 ':''}${i.n}</td><td>${i.slot}</td><td>${info(i)} <i>\u00b7 ${src(i)}</i></td></tr>`).join('')}</table>`;
 h+='<div style="opacity:.6">Greyed rows are above your current level.</div>';openModal(h)}
const AREAS=[['out',0,30,15,45,'1\u201310','A wind-scoured trading post of domes and moisture vaporators on the edge of the Dunes. Scrap Bots, Sand Raiders and Dune Beasts prowl between public kiosks.','Kessa was founded by scrap haulers after the old orbital lift collapsed. The raiders who run the holding pen claim they "keep the peace". Nobody believes them.'],
 ['town',15,30,30,45,'1\u201320','Dunewell, the last proper town before the lake. Forge, tavern, cape merchant, bike dealer and the mysterious Wanderer.','Dunewell grew around a deep water well and an even deeper mine. Elder Varo still remembers when the furnace burned wood.'],
 ['mine',30,30,45,45,'10\u201380','Twisting tunnels rich in Ferrite and Cobalt, home to Rock Mites, Cave Scorpions and the dreaded King Scorpion.','Three miners were lost to the King Scorpion before anyone dared go deep. Their drills are still down there, humming.'],
 ['tav',45,30,60,45,'5\u201310','The Dusty Flagon: engine grease, cheap ale and good gossip. Brakk and Vagabond Victor start fights for fun.','Grell bought the Flagon with winnings from a single hoverbike race. He has never raced since.'],
 ['lake',15,24,45,30,'\u2014','Lake Vire separates rustic Dunewell from gleaming Neo-Haven. Only a hoverbike can cross.','Ilo the fisher swears the lake was dug by a crashed colony ship. Tess says that\'s nonsense. They argue daily.'],
 ['haven',15,12,45,24,'20\u201360','A clean, chrome city of glass towers: the Armory, the Haven Grand Hotel, the Bank and the Town Hall.','Neo-Haven was built with Corp money and runs on Corp rules. Its mayor, Castellan, has never lost an election \u2014 or published a budget.'],
 ['sprawl',15,0,45,12,'35\u201370','Neon-soaked back streets in permanent rain. Robo-Hounds, Corp Datavaults, Zorium and Voidstone seams, and a sealed laser fence.','When the Corps moved uptown they left their machines behind. The Robo-Hounds still guard the streets for owners who will never return.'],
 ['lab',45,0,60,15,'35\u201390','Sublevel 9: a sterile research lab with Neural Cores, Med-Terminals, Vita Vials and Aetherium \u2014 guarded by the Infiltrator Guardian.','Project INFILTRATOR was meant to guard the lab with six hands and six weapons. It decided the scientists were the threat.'],
 ['hub',45,15,60,30,'\u2014','Orbital Hub Aster, a hunter\'s station in orbit. Weapons counter, free medical bay, and teleporters to the swamp and the Foundry.','Aster was a colony ark until it ran out of colonists. Now it rents teleport time to anyone brave or foolish enough.'],
 ['swamp',60,0,76,15,'40\u201355','Grimfen Swamp: humid bogland of mangroves and fireflies. Mire Leeches, Bog Lurkers, Mireglass rocks and glowing Glowcaps.','Grimfen was a terraforming test that worked too well. The Bog Lurkers are what became of the original survey team\'s pets.'],
 ['mirehold',76,0,90,15,'\u2014','Mirehold: a stilt village on rickety boardwalks. Every citizen wears a full robe and gas mask. Home of the waygate and Mortimer\'s Taxidermy.','The founders breathed the swamp air for a single season. Their grandchildren have never seen each other\'s faces \u2014 and consider it rude to ask.'],
 ['snow',90,30,105,45,'75\u201380','Frostpeak Outpost: a snowbound camp of log cabins and pines beyond the hub\'s sealed vault. Frostfang Yetis and Cryo Sentinels roam the drifts.','The vault was sealed when the ice-mining colony went silent. Bryn the quartermaster never left. Neither did the Sentinels.'],
 ['sick',90,15,105,30,'\u2014','The Mirehold Infirmary: a single cot, shelves of useless tonics, and one very unwell man.','Every remedy in the swamp has been tried here. Every one of them was brewed from swamp water.'],
 ['summit',105,15,120,30,'\u2014','Frostpeak Summit: a wind-blasted ledge above the snowfields, where an old sage watches the stars.','Nobody knows how long the sage has stood there. The Frostpeak scouts leave him tea. It is always gone by morning.'],
 ['chapel',105,0,120,15,'\u2014','The Mirehold Chapel: candlelit pews, a focus altar and Mother Silt, who tests the faith of all who ask for her blessing.','Built from the hull plates of a sunken barge. The swamp folk say the altar was here first, and the chapel simply grew around it.'],
 ['taxi',90,0,105,15,'\u2014','Mortimer\'s Taxidermy: a pedestal for every creature in the Frontier. Each one you defeat is mounted here \u2014 a living (well...) bestiary.','Mortimer took up taxidermy after his own pet Bog Lurker ate his previous career.'],
 ['foundry',60,15,90,30,'60\u201370','The Foundry: an automated factory of molten-metal vats, wall-to-wall Foundry Control Nodes and Reaper Endoskeletons.','No one has entered the Foundry\'s control room in forty years. The Reapers keep building more Reapers. Nobody knows what for.'],
 ['hotel',60,30,75,45,'\u2014','The Haven Grand: red carpet, silk sheets. Ticket holders rest for free.','The concierge has lost the master keycard eleven times this year. This is a record low.'],
 ['hall',75,30,90,45,'40','Neo-Haven Town Hall: marble, gold, and the mayor\'s private terminal.','The pillars are hollow. Rumour says they\'re full of undeclared credits.']];
const TH={};function thumb(a){const k=a[0];if(TH[k])return TH[k];const w=a[3]-a[1],hh=a[4]-a[2],pt=Math.min(8,Math.floor(160/w)),c=document.createElement('canvas');c.width=w*pt;c.height=hh*pt;const old=g;g=c.getContext('2d');g.setTransform(pt/32,0,0,pt/32,-a[1]*pt,-a[2]*pt);for(let y=a[2];y<a[4];y++)for(let x=a[1];x<a[3];x++)drawTile(x,y,0);g.setTransform(1,0,0,1,0,0);
 for(const o of objs){if(o.x<a[1]||o.x>=a[3]||o.y<a[2]||o.y>=a[4])continue;g.fillStyle={enemy:'#f33',npc:'#ff0',ore:'#9cf',plant:'#7f7',term:'#0ff',door:'#fff'}[o.t]||null;if(g.fillStyle)g.fillRect((o.x-a[1])*pt+pt/2-1.5,(o.y-a[2])*pt+pt/2-1.5,3,3)}g=old;return TH[k]=c}
function atlas(){let h='<h2>\ud83d\udcd6 Atlas of the Frontier</h2><div style="opacity:.8">Dots: <span style="color:#f33">enemies</span> \u00b7 <span style="color:#ff0">people</span> \u00b7 <span style="color:#9cf">ore</span> \u00b7 <span style="color:#7f7">plants</span> \u00b7 <span style="color:#0ff">terminals</span> \u00b7 <span style="color:#fff">doors / teleports</span></div>';
 AREAS.forEach((a,i)=>h+=`<div class="loc"><div id="th${i}"></div><div><b style="font-size:14px;color:#ffcf5a">${ZNAME[a[0]]}</b> <span style="color:#7fdcff">\u00b7 Levels ${String(a[5]).replace(/\d+/g,n=>CL(+n))}</span>${zoneOf(pl.x,pl.y)===a[0]?' <b style="color:#9f9">\u00b7 YOU ARE HERE</b>':''}<div style="margin:3px 0">${a[6]}</div><i>${a[7]}</i></div></div>`);
 openModal(h);AREAS.forEach((a,i)=>document.getElementById('th'+i).appendChild(thumb(a)))}
let WMC=null;function worldMap(){const P=6;if(!WMC){WMC=document.createElement('canvas');WMC.width=MW*P;WMC.height=MH*P;const old=g;g=WMC.getContext('2d');g.setTransform(P/32,0,0,P/32,0,0);for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)drawTile(x,y,0);g=old}
 openModal(`<h2>\ud83d\uddfa World map</h2><div style="opacity:.8">Building interiors are hidden \u2014 gold markers show their entrances. Dashed lines show elevators and teleporters. You blink white. Open \ud83d\udcd6 Atlas for location details.</div><div id="wmw" style="overflow:auto;-webkit-overflow-scrolling:touch"><canvas id="wm" width="${MW*P}" height="${MH*P}" style="display:block;margin:8px auto;border:1px solid #3a6ea8;max-width:100%"></canvas></div>${MOBV?'<div style="opacity:.7;font-size:11px;text-align:center">Swipe the map sideways to explore \u2194</div>':''}`);
 const c=document.getElementById('wm'),x=c.getContext('2d');if(MOBV){const w=document.getElementById('wmw');setTimeout(()=>{w.scrollLeft=pl.x*(w.scrollWidth/MW)-w.clientWidth/2},30)}(function fr(){if(modal.style.display==='none'||!c.isConnected)return;x.drawImage(WMC,0,0);
  const INT=['tav','hotel','hall','taxi','sick','chapel'];for(const a of AREAS)if(INT.includes(a[0])){x.fillStyle='#070a12';x.fillRect(a[1]*P,a[2]*P,(a[3]-a[1])*P,(a[4]-a[2])*P)}
  for(const a of AREAS){if(INT.includes(a[0]))continue;x.strokeStyle='#ffffff40';x.strokeRect(a[1]*P+.5,a[2]*P+.5,(a[3]-a[1])*P-1,(a[4]-a[2])*P-1);const cx=(a[1]+a[3])/2*P,cy=(a[2]+a[4])/2*P;x.font='bold 9px Arial';const n=ZNAME[a[0]],tw=x.measureText(n).width;x.fillStyle='#000a';x.fillRect(cx-tw/2-3,cy-8,tw+6,13);x.fillStyle='#ffe680';x.textAlign='center';x.fillText(n,cx,cy+2);x.textAlign='left'}
  x.setLineDash([3,3]);x.strokeStyle='#0ff';if(pl.flags.sock_em&&pl.flags.sock_core){x.beginPath();x.moveTo(59*P+3,21*P+3);x.lineTo(97*P+3,42*P+3);x.stroke()}for(const o of objs)if(o.t==='door'&&(o.tele||o.elev)&&visible(o)&&o.to[0]>o.x){x.beginPath();x.moveTo(o.x*P+3,o.y*P+3);x.lineTo(o.to[0]*P+3,o.to[1]*P+3);x.stroke()}x.setLineDash([]);
  for(const o of objs)if(o.t==='door'&&visible(o)&&!INT.includes(zoneOf(o.x,o.y))){if(o.tele||o.elev){x.fillStyle='#0ff';x.fillRect(o.x*P+1,o.y*P+1,4,4)}else{const tz=zoneOf(o.to[0],o.to[1]);if(!INT.includes(tz))continue;x.fillStyle='#000';x.fillRect(o.x*P-1,o.y*P-1,8,8);x.fillStyle='#ffcf5a';x.fillRect(o.x*P,o.y*P,6,6);x.font='bold 8px Arial';const nm=ZNAME[tz].replace('The ','').replace('Neo-Haven ',''),tw=x.measureText(nm).width;x.fillStyle='#000b';x.fillRect(o.x*P+8,o.y*P-4,tw+4,10);x.fillStyle='#ffcf5a';x.fillText(nm,o.x*P+10,o.y*P+4)}}
  if((Date.now()/300|0)%2){x.fillStyle='#fff';x.beginPath();x.arc(pl.x*P+3,pl.y*P+3,5,0,7);x.fill();x.fillStyle='#f22';x.beginPath();x.arc(pl.x*P+3,pl.y*P+3,3,0,7);x.fill()}
  requestAnimationFrame(fr)})()}

requestAnimationFrame(draw);setInterval(()=>{if(started&&(tab==='gear'||tab==='skills'))ui()},1500);
